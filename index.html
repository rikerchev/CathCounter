<!doctype html>
<html lang="bg" translate="no">
  <head>
    <!-- v3.51 — the app used to be reachable at catchcount.app4.you (still
         printed on old brochures/bookmarks) before the canonical domain
         became catchcount.app. Both domains point at this exact same
         Vercel deployment, so without this the old one just keeps working
         silently forever instead of steering visitors to the canonical
         one. Runs as early as possible — before any other script, even
         before the charset/meta tags below matter — and preserves the
         full path/query/hash so a printed QR/brochure link still lands on
         the right page after the jump. Add any other retired domain to
         OLD_HOSTS the same way if one ever comes up again. -->
    <script>
      (function () {
        var OLD_HOSTS = ["catchcount.app4.you"];
        if (OLD_HOSTS.indexOf(window.location.hostname) !== -1) {
          window.location.replace(
            "https://catchcount.app" + window.location.pathname + window.location.search + window.location.hash
          );
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="google-site-verification" content="MZXSdIMvmUs9U4dcnzqnotbBEbvVLe4YGLVtHjs3_Cs" />
    <!-- v3.31 — static AdSense site-ownership verification (the "Meta tag"
         method in AdSense → Sites → "Verify site ownership"). Unlike the
         script-based method (see src/components/AdSenseLoader.jsx /
         AdSenseSlot.jsx, which inject the ad script client-side via React,
         only once, and only when AdSense is enabled/configured and the
         visitor isn't premium), this tag is always present in the raw HTML
         Google's crawler fetches — no JavaScript execution, settings, or
         premium status involved — so it's the more reliable of the two
         verification methods. The publisher ID is not secret (it is always
         visible in any AdSense-serving page's own HTML), so hardcoding it
         here is the same as what every AdSense site does. -->
    <meta name="google-adsense-account" content="ca-pub-3727403550064718" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0e7490" />
    <!-- iOS: Safari ignores manifest.json's standalone/theme-color, these fill the gap -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Standardized equivalent Chrome/Edge now expect instead of the apple-only tag above -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CatchCount" />
    <title>CatchCount</title>
  </head>
  <body class="notranslate">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
